<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>编辑器测试台 · 知识库</title>
    <style>
      /* 测试台本地实现的 §3 设计 token（名字与 Prototype.md §3 冻结清单一致）。
         生产环境由 p-shell 在 src/index.css 定义同名变量，编辑器只引用变量名。 */
      :root {
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;
        --sp-6: 32px;
        --sp-7: 48px;
        --r-sm: 4px;
        --r-md: 8px;
        --r-lg: 12px;
        --r-xl: 20px;
        --r-full: 999px;
        --fs-xs: 12px;
        --fs-sm: 13px;
        --fs-base: 15px;
        --fs-md: 17px;
        --fs-lg: 20px;
        --fs-xl: 26px;
        --fs-2xl: 32px;
        --lh-tight: 1.25;
        --lh-normal: 1.55;
        --lh-relaxed: 1.75;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --dur-fast: 120ms;
        --dur: 200ms;
        --dur-slow: 320ms;
        --z-dropdown: 100;
        --z-modal: 200;
        --z-toast: 300;
        --sidebar-w: 260px;
        --editor-max: 760px;

        --bg: #ffffff;
        --bg-subtle: #f6f7f9;
        --bg-muted: #eef0f3;
        --surface: #ffffff;
        --surface-raised: #ffffff;
        --border: #e3e6ea;
        --border-strong: #c9ced6;
        --text: #1f2328;
        --text-secondary: #57606a;
        --text-muted: #8b949e;
        --accent: #3b6cf6;
        --accent-hover: #2f5be0;
        --accent-soft: #e6edfe;
        --danger: #d1242f;
        --danger-soft: #ffebe9;
        --success: #1a7f37;
        --warning: #9a6700;
        --code-bg: #f6f8fa;
        --code-text: #0a3069;
        --shadow-sm: 0 1px 2px rgba(27, 31, 36, 0.08);
        --shadow: 0 4px 16px rgba(27, 31, 36, 0.1);
        --shadow-lg: 0 12px 32px rgba(27, 31, 36, 0.16);
      }

      html[data-theme='dark'] {
        --bg: #0d1117;
        --bg-subtle: #161b22;
        --bg-muted: #21262d;
        --surface: #0d1117;
        --surface-raised: #161b22;
        --border: #30363d;
        --border-strong: #444c56;
        --text: #e6edf3;
        --text-secondary: #9aa4af;
        --text-muted: #6e7681;
        --accent: #6b9bff;
        --accent-hover: #8ab4ff;
        --accent-soft: #17233f;
        --danger: #ff7b72;
        --danger-soft: #2d1618;
        --success: #7ee787;
        --warning: #e3b341;
        --code-bg: #161b22;
        --code-text: #a5d6ff;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: var(--fs-base);
      }

      .lab-bar {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        flex-wrap: wrap;
        padding: var(--sp-2) var(--sp-4);
        border-bottom: 1px solid var(--border);
        background: var(--surface-raised);
      }

      .lab-bar button {
        font: inherit;
        font-size: var(--fs-sm);
        padding: var(--sp-1) var(--sp-3);
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        cursor: pointer;
        transition: background var(--dur-fast) var(--ease);
      }

      .lab-bar button:hover {
        background: var(--bg-muted);
      }

      .lab-bar button.on {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .lab-stat {
        margin-left: auto;
        font-size: var(--fs-xs);
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .lab-main {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="lab-root"></div>
    <script type="module" src="/src/editor-lab.tsx"></script>
  </body>
</html>
