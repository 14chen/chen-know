<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>当前离线 · 知识库</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #16181d;
        --muted: #667085;
        --accent: #4f46e5;
        --border: #e4e7ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --surface: #171a20;
          --text: #e8eaee;
          --muted: #98a2b3;
          --accent: #8b93f8;
          --border: #2a2f39;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: 28px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 6px; font-size: 14px; color: var(--muted); line-height: 1.6; }
      button {
        margin-top: 18px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">知</div>
      <h1>当前处于离线状态</h1>
      <p>网络连接断开了。已经缓存过的页面仍然可以打开；新的笔记、搜索和同步需要联网。</p>
      <p>恢复网络后点下面的按钮重新加载。</p>
      <button type="button" onclick="location.replace('/')">重新加载</button>
    </main>
  </body>
</html>
