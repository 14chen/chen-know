    <meta name="apple-mobile-web-app-title" content="知识库" />
    <title>知识库</title>
    <script>
      /* 主题引导：在任何样式生效前定好 data-theme，避免刷新时白/黑闪一下。
         与旧版共用 localStorage 键 kb.theme；旧版用 JSON.stringify 存值（形如 "dark"），
         这里读取时两种写法都兼容，写入时保持与旧版一致的 JSON 形态。 */
      (function () {
        try {
          var raw = localStorage.getItem('kb.theme')
          var theme = null
          if (raw) {
            try {
              theme = JSON.parse(raw)
            } catch (e) {
              theme = raw
            }
          }
          var known = ['light', 'dark', 'paper', 'midnight']
          if (known.indexOf(theme) < 0) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
