spring.application.name=knowledge-base

# ---- HTTP ----
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# ---- 会话 Cookie（API.md §0）----
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=KB_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Base value stays false so plain-http debugging keeps working. Tomcat additionally marks the
# session cookie Secure per request when the request itself is secure (see forward-headers-strategy).
server.servlet.session.cookie.secure=false
# Honour X-Forwarded-Proto/For/Host from the reverse proxy: request.isSecure() then reflects the
# original scheme, and Tomcat appends Secure to KB_SESSION only for those requests (DEF-E2-003).
server.forward-headers-strategy=native

# ---- 附件上传上限（API.md §7）----
# 单文件 256MB / 整包 320MB：导出 ZIP 要能到 200MB（与 ImportService 的解压上限对齐），
# 多选/文件夹批次要能容纳一堆图。单张图片 20MB 的判定保留在 AttachmentService 代码里。
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=320MB

# ---- 应用自有配置 ----
kb.version=1.0.0
# 数据目录；留空 = 自动定位到仓库根的 data/ 目录（见 com.kb.db.DataDirectory）
kb.data-dir=

# ---- 每日 AI 简报（BRIEFING.md）----
# 归档到哪个账号（定时任务与启动补抓用；POST /run 用调用者自己的空间）
kb.briefing.enabled=true
kb.briefing.owner=14chen
# 每天 18:30；启动补抓会从这里的「分 时」两个字段推出今天的生成时刻
kb.briefing.cron=0 30 18 * * *
# 每个源最多收录几条
kb.briefing.per-source=5
# 英文标题/摘要自动翻成中文（失败保留英文，不影响 run）
kb.briefing.translate=true
# 翻译提供方：auto（有 key 用 DeepL，否则 MyMemory）/ deepl / mymemory / none
kb.briefing.translate-provider=auto
# DeepL key：免费版以 :fx 结尾即自动走 api-free；留空则回落到 MyMemory
kb.briefing.deepl-key=
# 可选：显式覆盖 DeepL 端点（一般留空）
kb.briefing.deepl-endpoint=
# 抓文章页拿更充实的摘要与首图（失败静默跳过）
kb.briefing.fetch-article=true
# 单次运行最多下载几张配图
kb.briefing.max-images=20

# 已知不可达（反爬）的源：不发请求、不计入失败、不影响 status，仍出现在源清单里
kb.briefing.skip-sources=importai
# 归档目录名（按名字找现有目录，找不到就不进目录，不自动建）
# 中文必须写成 \uXXXX：.properties 按 ISO-8859-1 解码，直接写中文会变乱码
# 这里的值是「AI时代笔记」——用户指定的归档目录
kb.briefing.folder=AI\u65F6\u4EE3\u7B14\u8BB0
# 归档笔记的标签（逗号分隔）。中文必须写成 \uXXXX：.properties 按 ISO-8859-1 解码
kb.briefing.tags=AI\u7B80\u62A5

# ---- 开源周报（GitHub + Gitee 每周 star 涨最快）----
kb.weekly.enabled=true
kb.weekly.owner=14chen
# 每周五 18:30
kb.weekly.cron=0 30 18 * * FRI
kb.weekly.per-source=5
# 顶级目录名，下面按 ISO 周建子目录（如 开源周报/2026-W44）
kb.weekly.folder=\u5f00\u6e90\u5468\u62a5
# 归档笔记的标签（中文必须 \uXXXX）
kb.weekly.tags=\u5f00\u6e90\u5468\u62a5
# Gitee 数据文件（浏览器脚本产出；相对路径按工作目录解析）
kb.weekly.gitee-json=data/weekly-gitee.json

# ---- 归档策略（只搬家，不删除）----
kb.archive.enabled=true
kb.archive.weekly-keep-weeks=8
kb.archive.briefing-keep-days=90
kb.archive.cron=0 15 4 * * *
kb.archive.weekly-folder=\u5f00\u6e90\u5468\u62a5
kb.archive.weekly-archive-folder=\u5f52\u6863
kb.archive.briefing-archive-folder=AI\u7b80\u62a5\u5f52\u6863

# ---- 自动标签（默认关闭：先让用户观察，别乱打）----
kb.autotag.enabled=false

logging.level.com.kb=INFO
